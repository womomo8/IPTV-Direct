name: IPTV-Direct Unified Workflow

on:
  schedule:
    # 北京时间每天 06:17（UTC 前一天 22:17）
    - cron: "17 22 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "选择运行模式"
        required: true
        type: choice
        options:
          - 测试
          - 正式
          - 诊断
        default: 正式

permissions:
  contents: read

jobs:
  formal:
    name: 正式
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.mode == '正式')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: iptv-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show run mode
        run: echo "运行模式：正式"

      - name: Run IPTV-Direct
        id: formal_run
        env:
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: python main.py --mode formal

      - name: Persist publication state
        if: always()
        run: |
          if [ -d output/.iptv-publish-state ]; then
            git add -f output/.iptv-publish-state
          fi

          if [ "${{ steps.formal_run.outcome }}" = "success" ]; then
            for file in output/iptv.m3u output/iptv.txt; do
              if [ -f "$file" ]; then git add "$file"; fi
            done
          else
            for file in output/.iptv*.tmp output/.iptv*.stage-* output/.iptv*.recovery-* output/.iptv*.restore-*; do
              if [ -f "$file" ]; then git add -f "$file"; fi
            done
          fi

          if git diff --cached --quiet; then
            echo "没有需要持久化的发布状态。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.formal_run.outcome }}" = "success" ]; then
            git commit -m "更新 IPTV 订阅及发布备份"
          else
            git commit -m "保存 IPTV 发布恢复状态"
          fi

          for attempt in 1 2 3; do
            echo "同步远程分支并尝试推送：第 ${attempt} 次"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "发布状态持久化成功。"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 2; fi
          done

          echo "错误：发布状态无法持久化，重试 3 次后仍无法推送。"
          exit 1

  test:
    name: 测试
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == '测试'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check Python syntax
        run: |
          python -m py_compile main.py collector.py normalizer.py checker.py publisher.py globalping.py
          python -m py_compile tools/globalping_api_test.py
          python -m py_compile tests/*.py

      - name: Run current regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run full dry-run pipeline
        run: python main.py --mode test

  diagnostic:
    name: 诊断
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == '诊断'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show run mode
        run: echo "运行模式：诊断"

      - name: Run Globalping API diagnostic
        env:
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: python tools/globalping_api_test.py
