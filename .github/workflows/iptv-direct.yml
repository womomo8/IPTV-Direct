name: IPTV-Direct Unified Workflow

on:
  schedule:
    # 北京时间每天 06:17（UTC 前一天 22:17）
    - cron: "17 22 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "选择运行模式"
        required: true
        type: choice
        options:
          - 测试
          - 正式
          - 诊断
        default: 正式

permissions:
  contents: read

jobs:
  formal:
    name: 正式
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.mode == '正式')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show run mode
        run: echo "运行模式：正式"

      - name: Run IPTV-Direct
        env:
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: python main.py --mode formal

      - name: Commit subscription updates
        run: |
          for file in output/iptv.m3u output/iptv.txt; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "订阅文件没有变化，无需提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新 IPTV 订阅"

          for attempt in 1 2 3; do
            echo "同步远程分支并尝试推送：第 ${attempt} 次"
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "订阅更新已成功推送。"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "推送未成功，将重新同步后重试。"
              sleep 2
            fi
          done

          echo "错误：重试 3 次后仍无法推送订阅。"
          exit 1

  test:
    name: 测试
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == '测试'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show run mode
        run: echo "运行模式：测试"

      - name: Check Python syntax
        run: |
          python -m py_compile main.py checker.py globalping.py collector.py normalizer.py publisher.py
          python -m py_compile tests/test_checker.py tests/test_checker_limits.py
          python -m py_compile tests/test_globalping.py tests/test_main_globalping.py
          python -m py_compile tests/test_publisher.py tests/test_publisher_release.py tests/test_main_collection.py
          python -m py_compile tests/test_main_failure.py
          python -m py_compile tests/test_channel_categories.py
          python -m py_compile tests/test_normalizer.py

      - name: Run six-category tests
        run: |
          python -m unittest discover -s tests -p "test_channel_categories.py" -v

      - name: Run normalizer candidate limit tests
        run: |
          python -m unittest discover -s tests -p "test_normalizer.py" -v

      - name: Run checker tests
        run: |
          python -m unittest discover -s tests -p "test_checker*.py" -v

      - name: Run Globalping tests
        run: |
          python -m unittest discover -s tests -p "test_globalping.py" -v

      - name: Run main Globalping handoff tests
        run: |
          python -m unittest discover -s tests -p "test_main_globalping.py" -v

      - name: Run publisher tests
        run: |
          python -m unittest discover -s tests -p "test_publisher*.py" -v

      - name: Run main collection tests
        run: |
          python -m unittest discover -s tests -p "test_main_collection.py" -v

      - name: Run main failure tests
        run: |
          python -m unittest discover -s tests -p "test_main_failure.py" -v

      - name: Run existing test flow
        run: python main.py --mode test

  diagnostic:
    name: 诊断
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == '诊断'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show run mode
        run: echo "运行模式：诊断"

      - name: Run Globalping API diagnostic
        env:
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: python tools/globalping_api_test.py
