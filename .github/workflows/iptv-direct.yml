name: IPTV-Direct

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: 运行模式
        required: true
        type: choice
        options:
          - 正式
          - 测试
          - 诊断

permissions:
  contents: read

jobs:
  formal:
    name: 正式
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.mode == '正式')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: iptv-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show run mode
        run: echo "运行模式：正式"

      - name: Run IPTV-Direct
        id: formal_run
        env:
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: python main.py --mode formal

      - name: Persist publication state
        if: always()
        run: |
          # 失败运行只保存发布保护状态和现场文件。
          # 成功运行同时保存正式订阅及备份状态。
          if [ -d output/.iptv-publish-state ]; then
            git add -f output/.iptv-publish-state
          fi

          if [ "${{ steps.formal_run.outcome }}" = "success" ]; then
            for file in output/iptv.m3u output/iptv.txt; do
              if [ -f "$file" ]; then
                git add "$file"
              fi
            done
          else
            # 发布失败时保留现场临时文件，
            # 不将失败输出当作正式订阅。
            for file in output/.iptv*.tmp output/.iptv*.stage-* output/.iptv*.recovery-* output/.iptv*.restore-*; do
              if [ -f "$file" ]; then
                git add -f "$file"
              fi
            done
          fi

          if git diff --cached --quiet; then
            echo "没有需要持久化的发布状态。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.formal_run.outcome }}" = "success" ]; then
            git commit -m "更新 IPTV 订阅及发布备份"
          else
            git commit -m "保存 IPTV 发布恢复状态"
          fi

          for attempt in 1 2 3; do
            echo "同步远程分支并尝试推送：第 ${attempt} 次"
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "发布状态持久化成功。"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "推送未成功，将重新同步后重试。"
              sleep 2
            fi
          done

          echo "错误：发布状态无法持久化，重试 3 次后仍无法推送。"
          exit 1

  test:
    name: 测试
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == '测试'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show run mode
        run: echo "运行模式：测试"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run tests
        run: python -m pytest -q

  diagnostic:
    name: 诊断
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == '诊断'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show run mode
        run: echo "运行模式：诊断"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run diagnostic
        run: python main.py --mode diagnostic
