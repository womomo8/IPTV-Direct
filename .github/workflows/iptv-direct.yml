
name: IPTV-Direct Unified Workflow

on:
  schedule:
    # 北京时间每天 06:17（UTC 前一天 22:17）
    - cron: "17 22 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "选择运行模式"
        required: true
        type: choice
        options:
          - 正式
          - 测试
          - 诊断
        default: 测试

permissions:
  contents: read

jobs:
  formal:
    name: 正式运行
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.mode == '正式')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show run mode
        run: echo "运行模式：正式运行"

      - name: Run IPTV-Direct
        run: python main.py --mode formal

      - name: Commit subscription updates
        run: |
          for file in output/iptv.m3u output/iptv.txt; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "订阅文件没有变化，无需提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新 IPTV 订阅"
          git push

  test:
    name: 手动测试运行
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == '测试'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show run mode
        run: echo "运行模式：测试运行"

      - name: Check Python syntax
        run: |
          python -m py_compile tests/test_checker.py tests/test_checker_limits.py
          python -m py_compile tests/test_globalping.py tests/test_main_globalping.py
          python -m py_compile tests/test_main_source_batch.py
          python -m py_compile tests/test_publisher.py tests/test_publisher_release.py tests/test_main_collection.py
          python -m py_compile tests/test_main_failure.py
          python -m py_compile tests/test_normalizer.py
          python -m py_compile tests/test_source.py

      - name: Run main来源批次逐条调度专项测试
        run: |
          python -m unittest discover -s tests -p "test_main_source_batch.py" -v
      - name: Run source专项测试
        run: |
          python -m unittest discover -s tests -p "test_source.py" -v
      - name: Run normalizer专项测试
        run: |
          python -m unittest discover -s tests -p "test_normalizer.py" -v
      - name: Run checker专项测试
        run: |
          python -m unittest discover -s tests -p "test_checker*.py" -v

      - name: Run Globalping专项测试
        run: |
          python -m unittest discover -s tests -p "test_globalping.py" -v

      - name: Run main与Globalping交接测试
        run: |
          python -m unittest discover -s tests -p "test_main_globalping.py" -v

      - name: Run publisher专项测试
        run: |
          python -m unittest discover -s tests -p "test_publisher*.py" -v

      - name: Run main来源批次与停止条件专项测试
        run: |
          python -m unittest discover -s tests -p "test_main_collection.py" -v

      - name: Run main正式流程异常退出专项测试
        run: |
          python -m unittest discover -s tests -p "test_main_failure.py" -v

      - name: Run existing test flow
        run: python main.py --mode test

  diagnostic:
    name: 手动诊断 - Globalping 中国 IPv4 诊断
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == '诊断'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show run mode
        run: echo "运行模式：手动诊断"

      - name: Run Globalping API diagnostic
        run: python tools/globalping_api_test.py
