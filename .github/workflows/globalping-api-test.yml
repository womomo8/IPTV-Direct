
name: Globalping API Diagnostic Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  globalping-api-test:
    name: Test China IPv4 Probes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Globalping API diagnostic
        run: python tools/globalping_api_test.py
